<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="markTitle markDesc" width="120" height="120">
  <title id="markTitle">a11y-loop</title>
  <desc id="markDesc">A circular arrow that closes on itself, with a gap holding a focus-ring square — a loop that verifies before it finishes.</desc>

  <!--
    The mark is one idea: a loop that closes.

    The ring is drawn as an arc with a deliberate gap, and the gap is occupied
    by a square drawn in the same weight as a focus indicator. That is the
    whole argument of the tool in one shape — the loop is not finished until
    the thing it was checking is visibly accounted for.

    Currentcolor throughout, so a single file serves ink, accent, paper and
    forced-colors rendering without variants.
  -->
  <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round">
    <!-- The loop: an arc from ~55° round to ~-20°, leaving the gap at lower right. -->
    <path d="M 94.5 78.5 A 40 40 0 1 1 88.9 33.2" />
    <!-- Arrowhead closing the loop, pointing back into the ring. -->
    <path d="M 74.5 30.5 L 89.8 32.6 L 87.4 47.8" stroke-linejoin="round" />
  </g>

  <!-- The focus ring sitting in the gap. Square, offset, exactly how a real one reads. -->
  <rect x="79" y="79" width="30" height="30" rx="4"
        fill="none" stroke="currentColor" stroke-width="7" />
</svg>
